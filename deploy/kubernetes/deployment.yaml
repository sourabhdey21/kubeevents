apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeevents
  namespace: kubeevents
  labels:
    app.kubernetes.io/name: kubeevents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeevents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeevents
    spec:
      serviceAccountName: kubeevents
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeevents
          image: sourabhdey21700/kubeevents:0.2.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kubeevents
            - secretRef:
                name: kubeevents
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
