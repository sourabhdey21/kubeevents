{{- if and .Values.telegram.createSecret (not .Values.telegram.existingSecret) }}
{{- if or (not .Values.telegram.botToken) (not .Values.telegram.chatId) }}
{{- fail "telegram.botToken and telegram.chatId are required (or set telegram.existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeevents.fullname" . }}
  labels:
    {{- include "kubeevents.labels" . | nindent 4 }}
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: {{ .Values.telegram.botToken | quote }}
  TELEGRAM_CHAT_ID: {{ .Values.telegram.chatId | quote }}
{{- end }}
