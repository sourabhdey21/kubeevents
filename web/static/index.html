<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KubeEvents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;550;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <div class="brand-block">
      <p class="brand">KubeEvents</p>
      <p class="tagline">Live Kubernetes event console</p>
    </div>
    <div class="meta">
      <span id="cluster" class="pill">cluster</span>
      <span id="scope" class="pill muted">scope</span>
      <span id="live" class="live">connecting</span>
    </div>
  </header>

  <section class="summary" aria-label="Event summary">
    <div class="metric">
      <span class="metric-label">Captured</span>
      <span class="metric-value" id="stat-total">0</span>
    </div>
    <div class="metric warn">
      <span class="metric-label">Warnings</span>
      <span class="metric-value" id="stat-warnings">0</span>
    </div>
    <div class="metric ok">
      <span class="metric-label">Normal</span>
      <span class="metric-value" id="stat-normals">0</span>
    </div>
  </section>

  <section class="controls" aria-label="Filters">
    <input id="search" type="search" placeholder="Search reason, object, message…" autocomplete="off" />
    <select id="type">
      <option value="">All types</option>
      <option value="Warning">Warning</option>
      <option value="Normal">Normal</option>
    </select>
    <input id="namespace" type="text" placeholder="Namespace" list="ns-list" />
    <datalist id="ns-list"></datalist>
    <select id="kind">
      <option value="">All kinds</option>
    </select>
    <button id="clear" type="button">Reset</button>
  </section>

  <main>
    <div class="list-head">
      <span>Time</span>
      <span>Type</span>
      <span>Object</span>
      <span>Reason</span>
      <span>Message</span>
    </div>
    <div id="events" class="events" role="list"></div>
    <p id="empty" class="empty hidden">No events match your filters yet. Activity will appear here live.</p>
  </main>

  <footer>
    <span>Telegram notifications stay on for filtered alerts.</span>
    <span id="count-label">0 shown</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
